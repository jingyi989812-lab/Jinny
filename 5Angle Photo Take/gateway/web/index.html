<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UR Klinik Photo Flow — Gateway</title>
<style>
  body { font: 16px/1.6 -apple-system, system-ui, sans-serif; background: #FAF7F1; color: #211E1A;
         margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { background: #fff; border: 1px solid #E9E2D6; border-radius: 20px; padding: 28px; max-width: 380px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: #7A736A; font-size: 14px; margin: 0 0 16px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #FAF7F1;
         padding: 2px 6px; border-radius: 6px; }
  .ok { color: #0E9F6E; font-weight: 700; }
</style>
<div class="card">
  <h1>Gateway is running</h1>
  <p>This is the placeholder page. The Photo Flow app build replaces the contents of <code>web/</code>.</p>
  <p>Health check: <a href="/api/health"><code>/api/health</code></a></p>
  <p class="ok" id="s">checking…</p>
</div>
<script>
  fetch('/api/health').then(r => r.json())
    .then(d => document.getElementById('s').textContent = '✓ Connected — NAS date is ' + d.date)
    .catch(() => document.getElementById('s').textContent = '✗ API not responding');
</script>
